  <main class="content">
    <!--
      Same horizontal strip layout as Portfolio A. To add a photo: drop the
      file in images/portfolio-b/ and add an <img> tag below, then add its
      path to PORTFOLIO_B_IMAGES in main.js so it's eligible for the
      homepage's random hero image.
    -->
    <div class="strip-wrapper">
      <div class="strip">
        <img class="strip-image" src="images/portfolio-b/b1.jpg" alt="Portfolio B, photo 1" />
        <img class="strip-image" src="images/portfolio-b/b2.jpg" alt="Portfolio B, photo 2" />
        <img class="strip-image" src="images/portfolio-b/b3.jpg" alt="Portfolio B, photo 3" />
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
